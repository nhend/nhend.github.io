<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">

    <title>Nick Henderson</title>
    <meta name="description" content="Nick Henderson's personal website.">

    <meta property="og:title" content="Nick Henderson">
    <meta property="og:description" content="Nick Henderson's personal website.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nhend.com/">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="canonical" href="https://nhend.com/">
    <link rel="stylesheet" href="/css/style.css?v=7">
  </head>

  <body>
    <div class="page">
      <header>
        <a class="name" href="/" aria-label="Nick Henderson, home">Nick Henderson</a>
        <a class="contact" href="mailto:nick@nihenderson.com">Say hello</a>
      </header>

      <main>
        <h1>
          <span>Hi, I&rsquo;m Nick.</span>
          I make software for money and also not money.<sup class="project-ref" aria-hidden="true">*</sup>
        </h1>

        <div class="workbench" aria-label="Projects">
          <section class="work" aria-labelledby="movie-magnet-title">
            <span class="work-mark" aria-hidden="true">*</span>
            <div class="work-copy">
              <a class="work-title" id="movie-magnet-title" href="https://moviemag.net">Movie Magnet</a>
              <p class="work-description">Portland movie showtimes at independent theaters, all in one place.</p>

              <div class="movie-result" data-movie-result hidden>
                <a class="movie-title" data-movie-title href="https://moviemag.net"></a>
                <p class="movie-meta" data-movie-meta></p>
              </div>

              <p class="movie-note" data-movie-note aria-live="polite"></p>

              <div class="work-actions">
                <button class="project-action" data-movie-action type="button">Get a random showtime</button>
                <a class="work-url" href="https://moviemag.net">moviemag.net</a>
              </div>
            </div>
          </section>

          <section class="work work--drop" aria-labelledby="zone-drop-title">
            <span class="work-mark" aria-hidden="true">*</span>
            <div class="work-copy">
              <a class="work-title" id="zone-drop-title" href="/zone-drop/">Zone Drop</a>
              <p class="work-description">A needlessly thorough way to get dropped at a random spot in America.</p>

              <div class="drop-result" data-drop-result hidden>
                <a class="drop-location" data-drop-location href="/zone-drop/" target="_blank" rel="noreferrer"></a>
                <p class="drop-coordinates" data-drop-coordinates></p>
              </div>

              <p class="drop-note" data-drop-note aria-live="polite"></p>

              <div class="work-actions">
                <button class="project-action" data-drop-action type="button">Drop me somewhere</button>
                <a class="work-url" href="/zone-drop/">full thing</a>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="/js/site.js?v=9"></script>
  </body>
</html>
